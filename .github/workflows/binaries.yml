on:
  push:
    tags:
      - "v*" # "v1.2.3"
    branches:
      - master
    paths-ignore: ["nimble-guide/**", "**/*.md"]
  pull_request:
    paths-ignore: ["nimble-guide/**", "**/*.md"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            builder:  ubuntu-latest
            targets: x86_64-linux-musl,x86-linux-musl,aarch64-linux-musl,arm-linux-musleabihf,x86_64-windows-gnu,x86-windows-gnu
          - os: macosx
            builder: macos-latest
            targets: x86_64-macos-none,aarch64-macos-none
    defaults:
      run:
        shell: bash

    name: "${{ matrix.os }} builds"
    runs-on: ${{ matrix.builder }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "stable"
          yes: true

      - uses: mlugg/setup-zig@v2

      - name: Install Forge
        run: |
          nimble install -y "nimble@0.22.3"
          nimble install -y "forge@#no-lock"

      - name: build nimble
        run: |
          if [[ "${{ matrix.os }}" == "macosx" ]]; then
            forge +release --format='${name}-${target}' --verbose --target,=${{ matrix.targets }} -- -d:zippyNoSimd
            mkdir -p dist/nimble-universal-apple-darwin
            lipo -create \
              dist/nimble-x86_64-macos-none/nimble \
              dist/nimble-aarch64-macos-none/nimble \
              -output dist/nimble-universal-apple-darwin/nimble
          else
            forge +release --format='${name}-${target}' --verbose --target,=${{ matrix.targets }}
          fi

      - name: Download OpenSSL DLLs
        if: matrix.os == 'linux'
        run: |
          curl -sL "https://nim-lang.org/download/dlls.zip" -o dlls.zip
          unzip -o dlls.zip -d dlls/ "libcrypto-*.dll" "libssl-*.dll" "cacert.pem"
          cp dlls/* dist/nimble-x86_64-windows-gnu/
          cp dlls/* dist/nimble-x86-windows-gnu/

      - name: Compress binaries
        run: |
          cd dist
          for dir in nimble-*/; do
            target_dir=${dir%/}
            tar -c -z -v -f ../${target_dir}.tar.gz -C ${target_dir} .
            if [[ "$target_dir" == *"windows"* ]]; then
              cd ${target_dir}
              zip ../../${target_dir}.zip *
              cd ..
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nimble-binaries-${{ matrix.os }}
          path: |
            nimble-*.tar.gz
            nimble-*.zip

  create-github-release:
    if: github.event_name != 'pull_request'
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Download artefacts
        uses: actions/download-artifact@v8

      # Create/update the "latest" release
      - uses: ncipollo/release-action@v1
        with:
          name: Latest Nimble Binaries
          artifacts: "*/*"
          allowUpdates: true
          makeLatest: true
          prerelease: true
          tag: latest

      # Generate release notes and create a versioned release if this is a tag push
      - if: startsWith(github.ref, 'refs/tags/v')
        name: Generate release notes
        id: release_notes
        uses: actions/github-script@v8
        with:
          script: |
            const { data: releaseNotes } = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              target_commitish: context.sha,
            });
            core.setOutput('notes', releaseNotes.body)

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          name: Nimble ${{ github.ref_name }}
          artifacts: "*/*"
          allowUpdates: true
          makeLatest: false
          prerelease: false
          draft: true
          tag: ${{ github.ref_name }}
          body: ${{ steps.release_notes.outputs.notes }}

      - name: Delete artefacts
        uses: geekyeggo/delete-artifact@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          failOnError: false
          name: "nimble-binaries-*"
